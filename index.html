`<h3>HEALTH BENEFITS OF YOGA</h3><p>Yoga is a healthy lifestyle. One of the benefits of yoga is that you can choose a yoga style that is suitable for your lifestyle, such as hot yoga, power yoga, relaxation yoga, etc. If you are a yoga beginner, Hatha Yoga, which focuses on basic postures at a comfortable pace, would be great for you. If you want to increase strength through using more of your own body’s resistance, Power Yoga may be right for you. Whether you prefer to practise at home, in a private session, watching a DVD or at a studio or gym, there are a huge variety of options available to suit your goals and needs.</p><p>Improved flexibility is one of the first and most obvious benefits of yoga. During your first class, you probably won’t be able to touch your toes. But if you stick with it, you’ll notice a gradual loosening, and eventually, seemingly impossible poses will become possible. Each of the yoga poses is built to reinforce the muscles around the spine, the very center of your body, which is the core from which everything else operates. When the core is working properly, posture is improved, thus <u>alleviating</u> back, shoulder, and neck pain.</p><p>Strong muscles do more than look good. They also protect us from conditions like arthritis and back pain, and help prevent falls in elderly people. And when you build strength through yoga, you balance it with flexibility. If you just went to the gym and lifted weights, you might build strength at the expense of flexibility.</p><p>Yoga gets your blood flowing. More specifically, the relaxation exercises you learn in yoga can help your circulation, especially in your hands and feet. Yoga also gets more oxygen to your cells, which function better as a result. Twisting poses are thought to wring out venous blood from internal organs and allow oxygenated blood to flow in once the twist is released.</p><p>Many studies found that a consistent yoga practice improved depression and led to greater levels of happiness and better immune function.</p>`),

const T=$("test");let TS=null;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const dd=n=>D.find(d=>d.t==n);
const nz=t=>t.toLowerCase().replace(/\b(have|has|do|does|must|should|did) not\b/g,"$1n't").replace(/[’‘`]/g,"'").replace(/[.,!?;:]/g,"").replace(/\s+/g," ").trim();
function mq(d,i){const q=d.q[i],c=L.indexOf(q[5]),e=(d.e&&d.e[i])||"",pe=e.includes("¦")?e.split(" ¦ "):null;
 return{r:d.r,s:q[0],g:pe?"":e,o:sh([0,1,2,3].map(j=>({t:q[j+1],ok:j==c,x:pe?pe[j]:""})))}}
function newTest(){
 const G=dd("Grammar"),V=dd("Vocabulary"),W=dd("Writing"),pk=(d,n,ex=[])=>sh(d.q.map((_,i)=>i).filter(i=>!ex.includes(i))).slice(0,n).map(i=>[d,i]);
 const SA=[...pk(dd("Synonyms"),1),...pk(dd("Antonyms"),1)];
 const m=[...pk(G,3,[14,15,18]),...pk(V,2,[14]),...SA].map(([d,i])=>mq(d,i));
 const w=sh([...Array(32).keys()]).slice(0,6).map(i=>({p:W.q[i][0],a:W.q[i][1],h:W.h[i]||"",e:(W.e&&W.e[i])||"",ok:false,v:""}));
 TS={m,w,sel:{},done:false};
}
function showTest(){
 $("main").hidden=true;T.hidden=false;[...$("tabs").children].forEach((b,i)=>b.classList.toggle("on",i==D.length));
 if(!TS)TS={start:1};drawTest();scrollTo(0,0)}
function drawTest(){
 const x=TS;if(x.start)return drawStart();
 T.innerHTML=`<div class="rule">🎯 Bài kiểm tra 13 câu: 7 trắc nghiệm (mỗi câu 1 điểm) + 6 câu viết lại câu (mỗi câu 0,5 điểm). Mỗi lần bấm “Đề mới” là một đề khác. Đáp án chỉ hiện sau khi nộp bài.</div>
 <div class="rule" style="margin-top:0">👤 Họ tên: <b>${hx(x.name)}</b> &nbsp;·&nbsp; Lớp: <b>${hx(x.cls)}</b></div>
 ${x.m.map((q,i)=>`<div class="q"><p><span class="n">${i+1}.</span>${u(q.s)}</p><p style="color:var(--mu);font-size:1rem;margin:-4px 0 4px">${q.r}</p>${q.o.map((o,k)=>`<button class="o${x.sel[i]==k?" sel":""}" data-tq="${i}" data-k="${k}" ${x.done?"disabled":""}>${L[k]}. ${o.t}</button>`).join("")}${x.done?rv(q,i):""}</div>`).join("")}
 ${x.w.map((q,i)=>`<div class="q"><p><span class="n">${8+i}.</span>${q.p}</p>${q.h?`<p style="color:var(--mu);margin:0 0 6px">Từ gợi ý: <b>${q.h} …</b></p>`:""}<textarea data-w="${i}" placeholder="Your answer…" ${x.done?"disabled":""}>${x.done?q.v:(q.h?q.h+" ":"")}</textarea>${x.done?rw(q,i):""}</div>`).join("")}
 <div class="sc" id="ts">${x.done?"":"Chọn đáp án rồi bấm Nộp bài"}</div>
 <div>${x.done?"":`<button class="tb" id="sub">Nộp bài</button>`}<button class="tb g" id="nw">🔄 Học sinh tiếp theo (đề mới)</button></div>`;
 if(x.done)tScore()}
function rv(q,i){const k=TS.sel[i],ok=q.o[k]&&q.o[k].ok,c=q.o.findIndex(o=>o.ok);
 return`<div class="ex ${ok?"y":"n"}"><b>${ok?"✅ Chính xác!":(k==null?"⚠️ Bạn chưa chọn":"❌ Chưa đúng")+" – đáp án đúng là "+L[c]+"."}</b>${q.g?`<br>💡 ${q.g}`:""}${q.o.map((o,j)=>o.x?`<div style="margin-top:4px">${o.ok?"✅":"❌"} <b>${L[j]}. ${o.t}</b>${j==k?" (bạn chọn)":""} – ${o.x}</div>`:"").join("")}</div>`}
function rw(q,i){return`<div class="ex ${q.ok?"y":"n"}" id="wx${i}">${wh(q,i)}</div>`}
function wh(q,i){return`<b>${q.ok?"✅ Đúng":"❌ Chưa khớp đáp án mẫu"}</b><br>Bài làm: ${q.v||"(bỏ trống)"}<br>Đáp án mẫu: <b>${q.a}</b>${q.e?`<br>💡 ${q.e}`:""}<br><small>Có thể có cách viết đúng khác. Nếu bài giống nghĩa và đúng ngữ pháp, bấm nút bên dưới để tính lại.</small><br><button class="tb g" data-tg="${i}">${q.ok?"Bỏ tính đúng":"Tính là đúng"}</button>`}
function tScore(){const x=TS,m=x.m.filter((q,i)=>q.o[x.sel[i]]&&q.o[x.sel[i]].ok).length,w=x.w.filter(q=>q.ok).length*.5,f=n=>String(n).replace(".",",");
 $("ts").innerHTML=`${hx(x.name)} (Lớp ${hx(x.cls)}) – Trắc nghiệm ${m}/7 · Viết ${f(w)}/3 · <span style="font-size:1.4rem">Tổng điểm ${f(m+w)}/10</span>`}
const hx=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function drawStart(){
 T.innerHTML=`<div class="q st"><h2 style="margin:0 0 4px;font-size:1.4rem">🎯 Bài kiểm tra – English 11</h2>
 <p style="color:var(--mu);margin:0 0 14px">7 câu trắc nghiệm + 6 câu viết lại câu · Tổng 10 điểm</p>
 <label for="nm"><b>Họ và tên</b></label><input class="nm" id="nm" maxlength="60" autocomplete="off" placeholder="Ví dụ: Nguyễn Văn An">
 <label for="cl"><b>Lớp</b></label><input class="nm" id="cl" maxlength="12" autocomplete="off" placeholder="Ví dụ: 11A3">
 <div id="er" style="color:var(--no);min-height:1.5em;margin-bottom:6px"></div>
 <button class="tb" id="go" style="width:100%">Bắt đầu làm bài ▶</button>
 <p style="color:var(--mu);margin:12px 0 0">Mỗi học sinh nhận một đề khác nhau. Đáp án chỉ hiện sau khi nộp bài.</p></div>`;
 setTimeout(()=>{const n=$("nm");n&&n.focus()},50)}
function startGo(){const n=$("nm").value.trim(),c=$("cl").value.trim();
 if(!n||!c){$("er").textContent="Vui lòng nhập đầy đủ họ tên và lớp.";(!n?$("nm"):$("cl")).focus();return}
 newTest();TS.name=n;TS.cls=c;drawTest();scrollTo(0,0)}
T.onkeydown=e=>{if(e.key=="Enter"&&TS&&TS.start&&e.target.tagName=="INPUT"){e.preventDefault();e.target.id=="nm"?$("cl").focus():startGo()}};
T.onclick=e=>{
 if(e.target.id=="go"){startGo();return}
 const o=e.target.closest(".o");
 if(o&&!TS.done){const i=+o.dataset.tq;TS.sel[i]=+o.dataset.k;T.querySelectorAll(`[data-tq="${i}"]`).forEach(b=>b.classList.toggle("sel",b==o));return}
 if(e.target.id=="sub"){
  const un=TS.m.filter((q,i)=>TS.sel[i]==null).length;
  if(un&&!confirm(`Còn ${un} câu trắc nghiệm chưa chọn. Vẫn nộp bài?`))return;
  T.querySelectorAll("[data-w]").forEach(t=>{const q=TS.w[+t.dataset.w];q.v=t.value.trim();q.ok=nz(q.v)==nz(q.a)});
  TS.done=true;drawTest();scrollTo(0,0);return}
 if(e.target.id=="nw"){if(!TS.done&&!confirm("Quay lại màn hình nhập tên sẽ xóa bài đang làm. Tiếp tục?"))return;TS={start:1};drawTest();scrollTo(0,0);return}
 const g=e.target.closest("[data-tg]");
 if(g){const i=+g.dataset.tg,q=TS.w[i];q.ok=!q.ok;const b=$("wx"+i);b.className="ex "+(q.ok?"y":"n");b.innerHTML=wh(q,i);tScore()}
};
draw();
</script></body></html>
